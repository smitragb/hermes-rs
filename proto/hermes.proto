syntax = "proto3";

package hermes;

service HermesService {
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
}

message ReadRequest {
  string key = 1;
  string client_id = 2;
}

message ReadResponse {
  string value = 2;
}

message WriteRequest {
  string key = 1;
  string value = 2;
  string client_id = 3;
}

message WriteResponse {}
